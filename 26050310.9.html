<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>向量旋转与投影 - 26050310.9</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei',sans-serif;background:#f0f4f8;display:flex;justify-content:center;padding:20px}
.card{max-width:900px;width:100%;background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.12);padding:24px}
h1{font-size:20px;color:#1a365d;margin-bottom:4px}
.sub{color:#666;font-size:14px;margin-bottom:16px}
canvas{width:100%;height:auto;background:#fafcff;border-radius:12px;cursor:pointer;display:block}
.controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.btn{padding:8px 20px;border:none;border-radius:8px;font-size:14px;cursor:pointer;transition:.2s}
.btn-primary{background:#3b82f6;color:#fff}.btn-primary:hover{background:#2563eb}
.btn-outline{background:#fff;color:#3b82f6;border:1px solid #3b82f6}.btn-outline:hover{background:#eff6ff}
.slider-box{display:flex;align-items:center;gap:10px;font-size:13px;color:#555}
.slider-box input{width:140px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;font-size:13px}
.info-item{background:#f8fafc;padding:10px 14px;border-radius:8px;border-left:3px solid #3b82f6}
.info-item .label{color:#888;font-size:11px}
.info-item .value{color:#1e293b;font-weight:600;margin-top:2px}
.highlight{color:#2563eb}
.step{margin-top:14px;background:#fffbeb;border-radius:10px;padding:14px;font-size:14px;line-height:1.7;border:1px solid #fde68a;display:none}
.step.show{display:block}
.step b{color:#d97706}
@media(max-width:600px){.info{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="card">
<h1>🧭 向量旋转与投影</h1>
<p class="sub">26050310.9 · 拖动滑块观察旋转过程</p>

<canvas id="c" width="860" height="480"></canvas>

<div class="controls">
  <button class="btn btn-primary" onclick="togglePlay()">▶ 播放</button>
  <button class="btn btn-outline" onclick="resetView()">↺ 重置</button>
  <div class="slider-box">
    <span>旋转角</span>
    <input type="range" id="angleSlider" min="0" max="90" value="45">
    <span id="angleDisplay">45°</span>
  </div>
</div>

<div class="controls">
  <label style="font-size:13px;color:#555;display:flex;align-items:center;gap:6px;cursor:pointer">
    <input type="checkbox" id="showProjection" checked onchange="draw()"> 显示投影
  </label>
  <label style="font-size:13px;color:#555;display:flex;align-items:center;gap:6px;cursor:pointer">
    <input type="checkbox" id="showAngle" checked onchange="draw()"> 显示夹角弧
  </label>
</div>

<div class="info">
  <div class="info-item"><div class="label">向量 a</div><div class="value" id="infoA">(1.00, 1.73)</div></div>
  <div class="info-item"><div class="label">|a|</div><div class="value" id="infoMag">2.00</div></div>
  <div class="info-item"><div class="label">a 与 b 夹角 θ</div><div class="value" id="infoAngle">45°</div></div>
  <div class="info-item"><div class="label">投影 |a|·cosθ</div><div class="value highlight" id="infoProj">√2 ≈ 1.414</div></div>
</div>

<div class="step" id="stepBox">
  <b>💡 解题思路</b><br>
  投影 = |a|·cosθ = 2 × cos45° = 2 × √2/2 = <b>√2</b><br>
  不需要求 b 的坐标，直接利用旋转角确定夹角即可。
</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const OX = W/2, OY = H/2 + 30;
const SCALE = 100;
const PI = Math.PI;

let animating = false, animId = null;

const vecA = { x: 1, y: Math.sqrt(3) }; // |a| = 2

function getAngleDeg() {
  let v = parseFloat(document.getElementById('angleSlider').value);
  // Snap to exact 45
  if (Math.abs(v - 45) < 1.5) v = 45;
  document.getElementById('angleDisplay').textContent = v + '°';
  return v;
}

function rotateVec(v, deg) {
  const rad = deg * PI / 180;
  return {
    x: v.x * Math.cos(rad) - v.y * Math.sin(rad),
    y: v.x * Math.sin(rad) + v.y * Math.cos(rad)
  };
}

function formatNum(n) { return Math.abs(n) < 0.001 ? '0' : n.toFixed(2); }

function draw() {
  ctx.clearRect(0, 0, W, H);
  
  // Grid
  ctx.strokeStyle = '#e8ecf0';
  ctx.lineWidth = 1;
  for (let i = -4; i <= 4; i++) {
    const x = OX + i * SCALE, y = OY - i * SCALE;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  
  // Axes
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(OX - 200, OY); ctx.lineTo(OX + 200, OY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(OX, OY + 180); ctx.lineTo(OX, OY - 180); ctx.stroke();
  
  // Axis labels
  ctx.fillStyle = '#94a3b8';
  ctx.font = '13px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('x', OX + 210, OY - 8);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText('y', OX - 10, OY - 190);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('O', OX - 12, OY + 5);

  const deg = getAngleDeg();
  const vecB = rotateVec(vecA, deg);
  const showProj = document.getElementById('showProjection').checked;
  const showAngle = document.getElementById('showAngle').checked;

  // Helper: draw arrow
  function arrow(x1, y1, x2, y2, color, label, labelColor) {
    const ax = OX + x1 * SCALE, ay = OY - y1 * SCALE;
    const bx = OX + x2 * SCALE, by = OY - y2 * SCALE;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.stroke();
    // Arrowhead
    const angle = Math.atan2(ay - by, bx - ax);
    const headLen = 12;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(bx - headLen * Math.cos(angle - 0.4), by + headLen * Math.sin(angle - 0.4));
    ctx.lineTo(bx - headLen * Math.cos(angle + 0.4), by + headLen * Math.sin(angle + 0.4));
    ctx.closePath();
    ctx.fill();
    // Label
    if (label) {
      ctx.fillStyle = labelColor || color;
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      const lx = bx + 10, ly = by - 8;
      ctx.fillText(label, lx, ly);
    }
  }

  // Vector a
  arrow(0, 0, vecA.x, vecA.y, '#3b82f6', 'a', '#3b82f6');
  // Vector b
  arrow(0, 0, vecB.x, vecB.y, '#ef4444', 'b', '#ef4444');

  // Angle arc
  if (showAngle && deg > 0) {
    ctx.strokeStyle = '#10b981';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(OX, OY, 50, -vecA.angle * PI / 180, -vecB.angle * PI / 180, deg < 0);
    ctx.stroke();
    const midAngle = -(vecA.angle + vecB.angle) / 2 * PI / 180;
    ctx.fillStyle = '#10b981';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText('θ=' + deg + '°', OX + 62 * Math.cos(midAngle), OY - 62 * Math.sin(midAngle) + 4);
  }

  // Projection of a onto b
  if (showProj) {
    const bLen = Math.sqrt(vecB.x*vecB.x + vecB.y*vecB.y);
    const bUnit = { x: vecB.x / bLen, y: vecB.y / bLen };
    const projLen = (vecA.x * vecB.x + vecA.y * vecB.y) / bLen;
    const projVec = { x: bUnit.x * projLen, y: bUnit.y * projLen };
    
    // Dashed line from a tip to projection
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 1.5;
    const aTipX = OX + vecA.x * SCALE, aTipY = OY - vecA.y * SCALE;
    const pTipX = OX + projVec.x * SCALE, pTipY = OY - projVec.y * SCALE;
    ctx.beginPath(); ctx.moveTo(aTipX, aTipY); ctx.lineTo(pTipX, pTipY); ctx.stroke();
    ctx.setLineDash([]);
    
    // Projection vector (shorter, on b line)
    arrow(0, 0, projVec.x, projVec.y, '#f59e0b', '投影', '#f59e0b');
  }

  // Update info
  const aLen = Math.sqrt(vecA.x*vecA.x + vecA.y*vecA.y);
  const proj = aLen * Math.cos(deg * PI / 180);
  const aAngle = Math.atan2(vecA.y, vecA.x) * 180 / PI;
  const bAngle = Math.atan2(vecB.y, vecB.x) * 180 / PI;
  
  document.getElementById('infoA').textContent = `(${formatNum(vecA.x)}, ${formatNum(vecA.y)})`;
  document.getElementById('infoMag').textContent = formatNum(aLen);
  document.getElementById('infoAngle').textContent = deg + '°';
  document.getElementById('infoProj').textContent = deg === 45 ? '√2 ≈ 1.414' : formatNum(proj);
}

// Set vector angles for arc drawing
Object.defineProperty(vecA, 'angle', {
  get: function() { return Math.atan2(this.y, this.x) * 180 / PI; }
});
Object.defineProperty(vecB, 'angle', {
  get: function() { const deg = getAngleDeg(); const r = rotateVec(vecA, deg); return Math.atan2(r.y, r.x) * 180 / PI; }
});

function togglePlay() {
  const btn = document.querySelector('.btn-primary');
  if (animating) {
    animating = false;
    cancelAnimationFrame(animId);
    btn.textContent = '▶ 播放';
    return;
  }
  animating = true;
  btn.textContent = '⏹ 停止';
  const slider = document.getElementById('angleSlider');
  let dir = 1;
  function step() {
    if (!animating) return;
    let v = parseFloat(slider.value) + dir * 0.5;
    if (v >= 90) { v = 90; dir = -1; }
    if (v <= 0) { v = 0; dir = 1; }
    slider.value = v;
    draw();
    animId = requestAnimationFrame(step);
  }
  animId = requestAnimationFrame(step);
}

function resetView() {
  animating = false;
  cancelAnimationFrame(animId);
  document.querySelector('.btn-primary').textContent = '▶ 播放';
  document.getElementById('angleSlider').value = 45;
  draw();
}

document.getElementById('angleSlider').addEventListener('input', draw);
draw();
</script>
</body>
</html>
